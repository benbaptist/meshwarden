<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeshWarden</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#09090f" />
  <meta name="description" content="MeshCore node management and mesh observation dashboard" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              950: '#09090f',
              900: '#0f0f18',
              800: '#17172a',
              700: '#1f1f35',
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Socket.IO client (global `io`) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- ApexCharts (global `ApexCharts`) -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.0/dist/apexcharts.min.js"></script>

  <!-- Vue 3 + Vue Router + Pinia via import map -->
  <script type="importmap">
  {
    "imports": {
      "vue":              "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js",
      "vue-router":       "https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.esm-browser.prod.js",
      "vue-demi":         "https://cdn.jsdelivr.net/npm/vue-demi@0.14.10/lib/v3/index.mjs",
      "@vue/devtools-api": "/static/js/devtools-api-stub.js",
      "pinia":            "https://cdn.jsdelivr.net/npm/pinia@2.3.1/dist/pinia.esm-browser.js"
    }
  }
  </script>

  <style>
    body { background: #09090f; }
    .app-bg {
      background:
        radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, 0.13) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 100%, rgba(192, 38, 211, 0.07) 0%, transparent 45%),
        #09090f;
    }
    [v-cloak] { display: none !important; }
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .scrollbar-none { scrollbar-width: none; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.12s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    /* Leaflet dark theme overrides */
    .leaflet-container { font-family: inherit; background: #09090f; }
    .leaflet-popup-content-wrapper {
      background: #17172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #e4e4e7;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.1);
    }
    .leaflet-popup-tip { background: #17172a; }
    .leaflet-popup-content { margin: 12px 16px; font-size: 13px; line-height: 1.5; }
    .leaflet-control-zoom a {
      background: #17172a !important;
      color: rgba(255,255,255,0.6) !important;
      border-color: rgba(255,255,255,0.08) !important;
    }
    .leaflet-control-zoom a:hover { background: #1f1f35 !important; color: white !important; }
    .leaflet-control-attribution {
      background: rgba(9,9,15,0.75) !important;
      color: rgba(255,255,255,0.25) !important;
      font-size: 10px;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.4) !important; }
  </style>
</head>
<body class="h-full text-zinc-100 antialiased">
  <div id="app" v-cloak class="h-full"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
